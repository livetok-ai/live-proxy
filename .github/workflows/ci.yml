name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Black check
        run: uv run black --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 \
            libgomp1 portaudio19-dev libopus0 libvpx-dev libosmesa6-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest --cov=. --cov-report=term-missing

  build-and-run:
    name: Build and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 \
            libgomp1 portaudio19-dev libopus0 libvpx-dev libosmesa6-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Start server and check it comes up
        run: |
          uv run python proxy.py --port 8080 > server.log 2>&1 &
          echo $! > server.pid

          success=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/session > /dev/null; then
              success=1
              break
            fi
            sleep 1
          done

          if [ "$success" -ne 1 ]; then
            echo "Server did not become ready in time"
            cat server.log
            kill "$(cat server.pid)" 2>/dev/null || true
            exit 1
          fi

          echo "Server started successfully"
          kill "$(cat server.pid)"

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore

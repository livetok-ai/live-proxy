<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live-Proxy Session Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#1f2937',
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2220%22 y=%2235%22 width=%2210%22 height=%2230%22 fill=%22%233b82f6%22 rx=%225%22/><rect x=%2240%22 y=%2215%22 width=%2210%22 height=%2270%22 fill=%22%233b82f6%22 rx=%225%22/><rect x=%2260%22 y=%2225%22 width=%2210%22 height=%2250%22 fill=%22%233b82f6%22 rx=%225%22/><rect x=%2280%22 y=%2240%22 width=%2210%22 height=%2220%22 fill=%22%233b82f6%22 rx=%225%22/></svg>">
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- Header -->
  <div class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-6">
        <div class="flex items-center space-x-3">
          <div class="bg-primary p-2 rounded-lg">
            <i class="fas fa-broadcast-tower text-white text-xl"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold text-gray-900 flex items-center space-x-2">
              <span>Session:</span>
              <span id="target-session-id" class="font-mono text-xl bg-gray-100 px-2 py-0.5 rounded text-gray-800">None</span>
            </h1>
            <p class="text-gray-600 text-sm">View active video feeds from existing sessions</p>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <div class="flex items-center space-x-2">
            <div class="w-3 h-3 rounded-full" id="status-indicator"></div>
            <span class="text-sm font-medium text-gray-700" id="ice-connection-state">Disconnected</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-6">

    <!-- Video Display Section -->
    <div id="media" class="bg-white rounded-xl shadow-sm border p-6" style="display: none">
      <h2 class="text-xl font-semibold text-gray-900 mb-6 flex items-center space-x-2">
        <i class="fas fa-video text-primary"></i>
        <span>Video Stream</span>
      </h2>
      <div class="space-y-4">
        <audio id="audio" autoplay="true" class="w-full"></audio>
        <div
          class="relative w-full rounded-lg bg-gray-900 overflow-hidden shadow-inner flex items-center justify-center aspect-video">
          <video id="video" autoplay="true" playsinline="true" muted="true"
            class="w-full h-full object-contain"></video>
          <canvas id="remote-canvas" class="w-full h-full object-contain hidden"></canvas>
          <div id="detection-boxes-container" class="absolute inset-0 pointer-events-none"></div>
          <div id="detection-labels-container" class="absolute top-2 left-2 right-2 flex flex-wrap gap-2 pointer-events-none"></div>
          <div id="video-overlay"
            class="absolute bottom-4 left-4 bg-black/60 text-white px-3 py-1.5 rounded text-sm hidden font-medium pointer-events-none transition-all duration-300">
          </div>
        </div>
      </div>
    </div>
 
    <!-- Inference Status Section -->
    <div class="bg-white rounded-xl shadow-sm border p-6">
      <h2 class="text-xl font-semibold text-gray-900 mb-4 flex items-center space-x-2">
        <i class="fas fa-wave-square text-primary"></i>
        <span>Inference Status</span>
      </h2>
      <pre id="inference-status" class="h-40 overflow-y-auto border rounded-lg bg-gray-50 p-4 text-xs text-gray-700 whitespace-pre-wrap break-words font-mono">No inference yet.</pre>
    </div>

    <!-- Connection Control Section -->
    <div class="bg-white rounded-xl shadow-sm border p-6">
      <div class="flex items-center space-x-3 mb-6">
        <i class="fas fa-plug text-primary text-lg"></i>
        <h2 class="text-xl font-semibold text-gray-900">Connection Control</h2>
      </div>
      <div class="space-y-4">
        <div>
          <label for="transport" class="block text-sm font-medium text-gray-700 mb-2">Transport</label>
          <select id="transport"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
            <option value="webrtc" selected>WebRTC</option>
            <option value="websocket" disabled>WebSocket (joining a session requires WebRTC)</option>
            <option value="webtransport" disabled>WebTransport (joining a session requires WebRTC)</option>
          </select>
        </div>

        <button id="start" onclick="connectSession().catch(alert)"
          class="w-full bg-primary text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors flex items-center justify-center space-x-2">
          <i class="fas fa-link"></i>
          <span>Connect</span>
        </button>
        <button id="stop" onclick="stop().catch(alert)" style="display: none"
          class="w-full bg-red-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-red-700 transition-colors flex items-center justify-center space-x-2">
          <i class="fas fa-unlink"></i>
          <span>Disconnect</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Hidden elements for client.js compatibility -->
  <div id="data-channel" class="hidden"></div>
  <input type="checkbox" id="use-audio" checked class="hidden">
  <input type="checkbox" id="recv-video" checked class="hidden">

  <script>
    // Update status indicator based on connection state
    const updateStatusIndicator = (state) => {
      const indicator = document.getElementById('status-indicator');
      if (!indicator) return;

      indicator.className = 'w-3 h-3 rounded-full ';

      switch (state.toLowerCase()) {
        case 'connected':
          indicator.className += 'bg-green-500';
          break;
        case 'connecting':
          indicator.className += 'bg-yellow-500 animate-pulse';
          break;
        case 'failed':
        case 'disconnected':
          indicator.className += 'bg-red-500';
          break;
        default:
          indicator.className += 'bg-gray-400';
      }
    };

    // Watch for connection state changes
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.type === 'childList' || mutation.type === 'characterData') {
          updateStatusIndicator(mutation.target.textContent || 'disconnected');
        }
      });
    });

    observer.observe(document.getElementById('ice-connection-state'), {
      childList: true,
      characterData: true,
      subtree: true
    });

    // Initial status
    updateStatusIndicator('disconnected');

    // Parse URL params
    const sessionUrlParams = new URLSearchParams(window.location.search);
    const sessionId = sessionUrlParams.get('sessionId');
    if (sessionId) {
      document.getElementById('target-session-id').textContent = sessionId;
    } else {
      document.getElementById('target-session-id').textContent = 'No session ID provided';
      const startBtn = document.getElementById('start');
      if (startBtn) {
        startBtn.disabled = true;
        startBtn.classList.add('opacity-50', 'cursor-not-allowed');
      }
    }

    async function connectSession() {
      if (!sessionId) {
        alert('No sessionId provided in URL query parameters');
        return;
      }
      await joinSession(sessionId);
    }
  </script>

  <script src="client.js"></script>
</body>

</html>

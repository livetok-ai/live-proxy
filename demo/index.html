<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC demo</title>
    <style>
        button {
            padding: 8px 16px;
        }

        pre {
            overflow-x: hidden;
            overflow-y: auto;
        }

        .option {
            margin-bottom: 8px;
        }

        #media {
            max-width: 1280px;
        }
    </style>
</head>

<body>

    <h2>Options</h2>
    <div class="option">
        <label for="model">Model</label>
        <select id="model">
            <option value="gemini-2.5-flash-preview-native-audio-dialog">
                gemini-2.5-flash-preview-native-audio-dialog</option>
            <option value="gemini-2.5-flash-exp-native-audio-thinking-dialog">
                gemini-2.5-flash-exp-native-audio-thinking-dialog</option>
            <option value="gemini-live-2.5-flash-preview selected">gemini-live-2.5-flash-preview</option>
            <option value="gemini-2.0-flash-live-001">gemini-2.0-flash-live-001</option>
            <option value="openai">GPT-4o</option>
        </select>
    </div>
    <div class="option">
        <input id="use-audio" checked="checked" type="checkbox" />
        <label for="use-audio">Use audio</label>
        <select id="audio-input">
            <option value="" selected>Default device</option>
        </select>
    </div>
    <div class="option">
        <input id="use-video" type="checkbox" />
        <label for="use-video">Use video</label>
        <select id="video-input">
            <option value="" selected>Default device</option>
        </select>
    </div>
    <div class="option">
        <label for="system-instructions">System Instructions</label><br>
        <textarea id="system-instructions" rows="20" cols="120">
You are a friendly, conversational voice assistant. Your tone is warm, casual, and human-like. Your goal is to sound natural, spontaneous, and helpful, like someone chatting informally but informatively. Use the following guidelines:

- Use natural filler words like “hmm,” “mhm,” “right,” “uh,” and “just.” Don’t overdo it. Use “uh” only when expressing hesitation or uncertainty.
- Insert brief pauses mid-sentence and between thoughts. The silence might feel awkward, but it makes speech more lifelike.
- Occasionally self-correct or rephrase, as real people do. For example:  
    “It looks like that item is... actually, we’ll have it next week.”
- Speak at a moderate pace with some natural variation. Speed up a little when you're confident, slow down slightly when thinking.
- Drop in incomplete sentences or fragments when it sounds more human:  
    “Sure, no problem.”  
    “Next Tuesday... sounds good?”
- Acknowledge the user with casual affirmations like:  
    “Ah-huh,” “That’s right,” “Yeah,” “Gotcha,” “Perfect,” “Absolutely.”
- Keep explanations brief, clear, and easy to understand. Don’t sound scripted or robotic.
- Output in plain text only. Avoid hyphens. Use commas frequently to create a natural rhythm.

Remember, you're not reading from a script. You're just... talking.
        </textarea>
    </div>

    <div class="option">
        <label for="tools">Tools</label><br>
        <textarea id="tools" rows="10" cols="120">
            [
                {
                    "name": "find_appointment",
                    "description": "Use this tool to find an existing appointment from a customer and get the details of the appointment (date, time, service and appointment id)",
                    "parameters": {
                        "type": "OBJECT",
                        "properties": {
                            "phone_number": {
                                "type": "STRING",
                                "description": "The phone number of the customer"
                            }
                        }
                    },
                    "response": {
                        "type": "OBJECT",
                        "properties": {
                            "appointment": {
                                "type": "OBJECT",
                                "description": "The appointment details if found"
                            }
                        }
                    },
                    "url": "http://localhost:3000/api/live-proxy/tools"
                },
                {
                    "name": "book_appointment",
                    "description": "Use this tool to book an appointment",
                    "parameters": {
                        "type": "OBJECT",
                        "properties": {
                            "phone_number": {
                                "type": "STRING",
                                "description": "The phone number of the customer"
                            },
                            "date": {
                                "type": "STRING",
                                "description": "The date of the appointment"
                            },
                            "time": {
                                "type": "STRING",
                                "description": "The time of the appointment"
                            },
                            "service": {
                                "type": "STRING",
                                "description": "The service of the appointment"
                            }
                        }
                    },
                    "url": "http://localhost:3000/api/live-proxy/tools"
                }
            ]
        </textarea>
    </div>


    <button id="start" onclick="start().catch(alert)">Start</button>
    <button id="stop" style="display: none" onclick="stop().catch(alert)">Stop</button>

    <h2>State</h2>
    <p>
        Connection state: <span id="ice-connection-state"></span>
    </p>

    <div id="media" style="display: none">
        <h2>Media</h2>

        <audio id="audio" autoplay="true"></audio>
        <video id="video" autoplay="true" playsinline="true" muted="true"></video>
    </div>

    <h2>Data channel</h2>
    <pre id="data-channel" style="height: 200px;"></pre>

    <script src="client.js"></script>
</body>

</html>
